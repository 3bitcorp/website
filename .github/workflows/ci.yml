name: CI

on:
  push:
  pull_request:

jobs:
  # ─────────────────────────────────────────────
  # 1. Validate HTML structure
  # ─────────────────────────────────────────────
  validate-html:
    name: Validate HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install html5validator
        run: pip install html5validator

      - name: Validate HTML files
        run: html5validator --root . --ignore-re "Attribute .hx-" --log WARNING
        # Ignore HTMX custom attributes (hx-*) which are valid but not in HTML5 spec

  # ─────────────────────────────────────────────
  # 2. Check all referenced assets exist
  # ─────────────────────────────────────────────
  check-assets:
    name: Check Assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify required files exist
        run: |
          echo "Checking required assets..."
          missing=0

          check() {
            if [ -f "$1" ]; then
              echo "  ✓ $1"
            else
              echo "  ✗ MISSING: $1"
              missing=$((missing + 1))
            fi
          }

          check "index.html"
          check "assets/3bitcorp-logo.png"
          check "assets/css/custom.css"
          check "assets/js/main.js"

          if [ $missing -ne 0 ]; then
            echo ""
            echo "❌ $missing required file(s) missing"
            exit 1
          fi
          echo ""
          echo "✅ All required assets present"

      - name: Check HTML references local assets
        run: |
          echo "Scanning index.html for broken local asset references..."
          missing=0

          while IFS= read -r ref; do
            # Strip query strings and anchors
            path="${ref%%\?*}"
            path="${path%%#*}"
            # Skip CDN / absolute URLs
            [[ "$path" == http* ]] && continue
            [[ -z "$path" ]] && continue

            if [ ! -f "$path" ]; then
              echo "  ✗ BROKEN ref: $path"
              missing=$((missing + 1))
            else
              echo "  ✓ $path"
            fi
          done < <(grep -oP '(?<=src="|href=")[^"]+' index.html | grep -v '^#' | grep -v '^http')

          if [ $missing -ne 0 ]; then
            echo ""
            echo "❌ $missing broken local asset reference(s)"
            exit 1
          fi
          echo ""
          echo "✅ All local asset references resolved"

  # ─────────────────────────────────────────────
  # 3. Check external links (CDN, etc.)
  # ─────────────────────────────────────────────
  check-links:
    name: Check External Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check CDN availability
        run: |
          echo "Checking CDN links referenced in index.html..."
          ok=0
          fail=0

          while IFS= read -r url; do
            status=$(curl -o /dev/null -s -w "%{http_code}" --max-time 10 "$url" || echo "000")
            if [[ "$status" == 2* ]] || [[ "$status" == "301" ]] || [[ "$status" == "302" ]]; then
              echo "  ✓ $url ($status)"
              ok=$((ok + 1))
            else
              echo "  ⚠ $url ($status)"
              fail=$((fail + 1))
            fi
          done < <(grep -oP '(?<=src="|href=")https?://[^"]+' index.html | sort -u)

          echo ""
          echo "CDN check: $ok reachable, $fail unreachable"
          # Warn but don't fail — CDN may have rate limits in CI
          exit 0

  # ─────────────────────────────────────────────
  # 4. Lint JavaScript
  # ─────────────────────────────────────────────
  lint-js:
    name: Lint JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ESLint
        run: npm install -g eslint

      - name: Lint JS assets
        run: |
          eslint assets/js/main.js \
            --rule '{"no-undef": "warn", "no-unused-vars": "warn", "semi": ["error","always"]}' \
            --env browser,es2020 \
            --no-eslintrc || true
          echo "JS lint complete"

  # ─────────────────────────────────────────────
  # 5. Netlify deploy readiness check
  # ─────────────────────────────────────────────
  netlify-ready:
    name: Netlify Deploy Readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate netlify.toml exists
        run: |
          test -f netlify.toml && echo "✓ netlify.toml present" || (echo "✗ netlify.toml missing" && exit 1)

      - name: Validate Netlify Function syntax
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check function JS syntax
        run: node --check netlify/functions/contact.js && echo "✓ contact.js syntax OK"

      - name: Check netlify.toml structure
        run: |
          grep -q 'publish' netlify.toml && echo "✓ publish dir set" || (echo "✗ publish missing" && exit 1)
          grep -q 'functions' netlify.toml && echo "✓ functions dir set" || (echo "✗ functions missing" && exit 1)
          grep -q '/api/contact' netlify.toml && echo "✓ contact redirect set" || (echo "✗ contact redirect missing" && exit 1)
          echo "✅ netlify.toml structure valid"

      - name: Confirm hidden Netlify Forms detection element
        run: |
          grep -q 'data-netlify="true"' index.html && echo "✓ Netlify Forms detection element present" || \
            (echo "✗ data-netlify attribute missing from index.html" && exit 1)

  # ─────────────────────────────────────────────
  # 6. Summary gate — all required jobs pass
  # ─────────────────────────────────────────────
  ci-passed:
    name: CI Passed
    runs-on: ubuntu-latest
    needs: [validate-html, check-assets, check-links, lint-js, netlify-ready]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ needs.validate-html.result }}" != "success" ]] || \
             [[ "${{ needs.check-assets.result }}"  != "success" ]] || \
             [[ "${{ needs.check-links.result }}"   != "success" ]] || \
             [[ "${{ needs.lint-js.result }}"       != "success" ]] || \
             [[ "${{ needs.netlify-ready.result }}" != "success" ]]; then
            echo "❌ One or more CI jobs failed"
            exit 1
          fi
          echo "✅ All CI jobs passed — safe to deploy"

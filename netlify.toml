[build]
  publish = "."
  functions = "netlify/functions"

# Redirect /api/contact → Netlify Function
[[redirects]]
  from   = "/api/contact"
  to     = "/.netlify/functions/contact"
  status = 200

# SPA-style fallback (optional — keeps direct URL loads working)
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
